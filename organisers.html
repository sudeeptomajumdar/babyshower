<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer RSVP Dashboard</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="robots" content="noindex, nofollow">
    <style>
        /* Shared styling with your main site */
        :root {
            --theme-color: #6b8e23; /* Your olive green */
            --bg-color: #fdfbf7;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: #333;
            padding: 20px;
            margin: 0;
        }
        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--theme-color);
            padding-bottom: 10px;
        }
        .btn {
            background-color: var(--theme-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        .btn:hover { 
            background-color: #55711b; 
        }
        .table-wrapper {
            overflow-x: auto; /* Lets the table scroll horizontally on small screens */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--theme-color);
            color: white;
            white-space: nowrap;
        }
        tr:hover { background-color: #f9f9f9; }
        
        /* Color-coded status for easy scanning */
        .status-yes { color: #2e7d32; font-weight: bold; }
        .status-no { color: #c62828; }
        .status-maybe { color: #ef6c00; }
    </style>
</head>
<body>
    <div id="loginScreen" style="max-width: 400px; margin: 100px auto; text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <h2>Organizer Access</h2>
        <p>Please enter the password to view RSVPs.</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="text" id="adminUser" name="username" autocomplete="username" value="admin" placeholder="Username" required style="padding: 10px; width: 80%; margin-bottom: 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
            <br>
            <input type="password" id="adminPass" name="password" autocomplete="current-password" placeholder="Password" required style="padding: 10px; width: 80%; margin-bottom: 20px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
            <br>
            <button type="submit" class="btn">Log In</button>
        </form>
    </div>

    <div id="dashboardScreen" class="dashboard-container" style="display: none;">
                <div class="header-bar">
            <h1>Organizer RSVP Dashboard</h1>
            <div>
                <button class="btn" onclick="logout()" style="background-color: #555; margin-right: 10px;">Log Out</button>
                <button class="btn" onclick="downloadCSV()">⬇ Download for Excel</button>
            </div>
        </div>
        
        <p style="font-size: 1.2em;">Total Guests Attending: <strong id="totalCount">0</strong></p>

        <div class="table-wrapper">
            <table id="rsvpTable">
                <thead>
                    <tr>
                        <th>Date Submited</th>
                        <th>Guest Name</th>
                        <th>Email Address</th>
                        <th>Status</th>
                        <th>Party Size</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" style="text-align: center;">Loading data from database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // TODO: Paste your actual Firebase Config Object here!
        const firebaseConfig = {
            apiKey: "AIzaSyBbNCpQdK5MCBTSqScqexw3fshs7z2kezY",
            authDomain: "baby-shower-evite.firebaseapp.com",
            databaseURL: "https://baby-shower-evite-default-rtdb.firebaseio.com",
            projectId: "baby-shower-evite",
            storageBucket: "baby-shower-evite.firebasestorage.app",
            messagingSenderId: "220534452127",
            appId: "1:220534452127:web:c42f6d6f41e62eaf8a97aa"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app); 
    </script>

    <script>
                // 1. The NEW Form Submission Handler
               // 1. The Form Submission Handler
        async function handleLogin(event) {
            event.preventDefault(); 
            
            const usernameInput = document.getElementById('adminUser').value;
            const passwordInput = document.getElementById('adminPass').value;
            
            if (passwordInput === 'babyshower2026' && usernameInput === 'admin') { 
                
                // Prompt to save password
                if (window.PasswordCredential && navigator.credentials) {
                    const cred = new PasswordCredential({
                        id: usernameInput,
                        password: passwordInput
                    });
                    try {
                        await navigator.credentials.store(cred);
                    } catch (err) {
                        console.log("Browser blocked password save prompt:", err);
                    }
                }

                // --- NEW: Save the login state in the browser's memory ---
                sessionStorage.setItem('isLoggedIn', 'true');
                // ---------------------------------------------------------

                // Hide login screen, show dashboard
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                loadData(); 
                
            } else {
                alert("Incorrect Username or Password!");
                document.getElementById('adminPass').value = ''; 
            }
        }

        // --- NEW: Log Out Function ---
        function logout() {
            // Remove the sticky note and refresh the page to lock it
            sessionStorage.removeItem('isLoggedIn');
            window.location.reload();
        }
        // ------------------------------

        // --- NEW: Check for login state exactly when the page opens ---
        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                // If the sticky note is there, skip the login screen!
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                loadData();
            }
        };
        // --------------------------------------------------------------

        // 2. The Data Loader
        async function loadData() {
            import("https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js").then(async (firestore) => {
                try {
                    const rsvpsRef = firestore.collection(window.db, "rsvps");
                    const q = firestore.query(rsvpsRef, firestore.orderBy("timestamp", "desc"));
                    const querySnapshot = await firestore.getDocs(q);
                    
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = ''; 
                    let totalAttending = 0;

                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.status === 'yes') { totalAttending += data.guests; }

                        const dateObj = data.timestamp ? data.timestamp.toDate() : new Date();
                        const dateStr = dateObj.toLocaleDateString();

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><small>${dateStr}</small></td>
                            <td><strong>${data.name}</strong></td>
                            <td>${data.email}</td>
                            <td class="status-${data.status}">${data.status.toUpperCase()}</td>
                            <td>${data.guests}</td>
                            <td>${data.message || ''}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('totalCount').innerText = totalAttending;
                } catch (error) {
                    console.error("Error fetching data:", error);
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="color:red; text-align:center;">Error loading data. Check console.</td></tr>';
                }
            });
        }

        // 3. The CSV Downloader
        function downloadCSV() {
            const table = document.getElementById("rsvpTable");
            let rows = Array.from(table.rows);
            let csvContent = "";
            rows.forEach(row => {
                let rowData = Array.from(row.cells).map(cell => {
                    let text = cell.innerText.replace(/"/g, '""'); 
                    return `"${text}"`; 
                });
                csvContent += rowData.join(",") + "\n";
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "Baby_Shower_RSVPs.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
